[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-Vwayland"
version = "0.2.0"
description = "Spawn virtual Wayland compositors from Python to capture and control GUI programs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "py-Vwayland Authors" },
]
keywords = ["wayland", "compositor", "headless", "automation", "screenshot", "gui-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
# Runtime dependencies: none (standard library only). The compositor binary and
# native libraries are bundled in the wheel.
dependencies = []

[project.optional-dependencies]
# Required for screenshot().to_pil()
pillow = ["Pillow>=9.0"]
test = ["pytest>=7.0"]

[project.scripts]
vwayland = "vwayland.cli:main"

[project.urls]
Documentation = "https://github.com/llaa33219/py-Vwayland/tree/main/docs"
Source = "https://github.com/llaa33219/py-Vwayland"

[tool.hatch.build.targets.wheel]
packages = ["src/vwayland"]
# The native binary/libs are gitignored, so pull them in explicitly.
# Build fails loudly when they are missing (run scripts/build_compositor.py first).
[tool.hatch.build.targets.wheel.force-include]
"src/vwayland/_native/vwayland-compositor" = "vwayland/_native/vwayland-compositor"
"src/vwayland/_native/lib" = "vwayland/_native/lib"

[tool.hatch.build.targets.sdist]
include = [
    "src/vwayland",
    "rust",
    "scripts",
    "docs",
    "tests",
    "LICENSE",
    "README.md",
    "AGENTS.md",
    "pyproject.toml",
]
# `python -m build` builds the wheel from the sdist, so the native artifacts
# must be present in the sdist as well (same force-include as the wheel).
[tool.hatch.build.targets.sdist.force-include]
"src/vwayland/_native/vwayland-compositor" = "src/vwayland/_native/vwayland-compositor"
"src/vwayland/_native/lib" = "src/vwayland/_native/lib"
